name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Build generated code
        run: bazelisk build //logger/schema:gen_logger_pb

      - name: Verify source tree is up-to-date
        run: bazelisk test //logger/schema:write_logger_pb_test

      - name: Make source tree stale by changing the schema
        run: echo "traceId:string" >> logger/schema/schema.txt

      - name: Verify test fails for stale source tree
        run: |
          set +e
          bazelisk test //logger/schema:write_logger_pb_test --test_output=errors 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 3 ]; then
            echo "::error::Expected exit code 3 (test failed), got $status"
            exit 1
          fi
          if ! grep -q "logger.pb.go is out of date" test.log; then
            echo "::error::Expected out-of-date message in test output"
            exit 1
          fi

      - name: Update source tree
        run: |
          bazelisk run //logger/schema:write_logger_pb
          if ! grep -q "TraceId string" logger/schema/logger.pb.go; then
            echo "::error::Expected logger.pb.go to contain the new TraceId field"
            exit 1
          fi

      - name: Verify test passes after update
        run: bazelisk test //logger/schema:write_logger_pb_test
